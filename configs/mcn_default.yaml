# Default configuration for the Moebius Competency Network (MCN), research/mathematical_derivation/derivation.md
model:
  in_dim_skill: 16        # set from the data when training
  in_dim_comp: 16
  embed_dim: 32
  max_order: 3            # k in derivation.md section 6.1
  rank: 16                # R, CP rank (variant "cp")
  variant: cp             # "cp" or "ds"
  ds_hidden: 32
  use_gate: true          # relevance gate a_{c,s}, section 6.2
  gate_bias: 0.0
  init_scale: 0.3
  n_max: 12               # maximum set size
train:
  seed: 0
  epochs: 60
  batch_size: 128
  lr: 0.003
  weight_decay: 0.0001
  grad_clip: 1.0
  device: auto            # auto | cpu | cuda | mps
  objective: nnpu         # nnpu | unknown_as_negative (the latter exists only as a baseline)
  nnpu_mode: kiryo        # kiryo | clip
  nnpu_beta: 0.0
  nnpu_gamma: 1.0
  lambda_neg: 1.0         # weight of reviewed-negative term, section 11.2
  kappa: 0.0001           # order-weighted l1, section 11.3
  lambda_mono: 0.0        # optional monotonicity penalty, section 11.4
